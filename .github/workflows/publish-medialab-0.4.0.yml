name: Publish MediaLab 0.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-medialab-0.4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate MediaLab
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          pytest -q
          python -m compileall -q app

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          tar -czf medialab-0.4.0-build.tar.gz app requirements.txt entrypoint.sh

          rm -rf /tmp/medialab-portainer
          mkdir -p /tmp/medialab-portainer
          cp Dockerfile.portainer portainer-stack.yml stack.env.example tmdb.env.example README.md UPGRADE-0.4.0.txt /tmp/medialab-portainer/
          cp medialab-0.4.0-build.tar.gz /tmp/medialab-portainer/
          (cd /tmp/medialab-portainer && zip -qr "$GITHUB_WORKSPACE/medialab-portainer-0.4.0.zip" .)

          rm -rf /tmp/medialab-upload
          mkdir -p /tmp/medialab-upload
          cp Dockerfile.portainer /tmp/medialab-upload/Dockerfile
          cp medialab-0.4.0-build.tar.gz /tmp/medialab-upload/
          tar -czf medialab-portainer-upload-0.4.0.tar.gz -C /tmp/medialab-upload Dockerfile medialab-0.4.0-build.tar.gz

          sha256sum \
            medialab-0.4.0-build.tar.gz \
            medialab-portainer-0.4.0.zip \
            medialab-portainer-upload-0.4.0.tar.gz \
            > medialab-0.4.0-SHA256SUMS.txt

      - name: Replace release v0.4.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release delete v0.4.0 --yes --cleanup-tag || true
          fi
          git tag -d v0.4.0 2>/dev/null || true
          git push origin :refs/tags/v0.4.0 2>/dev/null || true
          git tag -a v0.4.0 -m 'MediaLab 0.4.0'
          git push origin v0.4.0

          cat > /tmp/release-notes.md <<'EOF'
          ## MediaLab 0.4.0

          ### Portainer – empfohlen: nur eine Datei
          Für **Images → Build a new image → Upload** wird nur benötigt:

          `medialab-portainer-upload-0.4.0.tar.gz`

          Das Archiv enthält bereits `Dockerfile` und Build-Archiv im richtigen Build-Kontext.

          ### Neu in 0.4.0
          - sichere Watchfolder-Verarbeitung für große Kopiervorgänge nach `New`
          - FFprobe startet erst nach mehrfach bestätigter Dateistabilität
          - Technikanalyse-Fehler unter `/library/errors` sichtbar und erneut auswählbar
          - kurzes rotierendes Web-Log unter `/log`
          - Branding auf **MediaLab**
          - bestehendes `media_ingest_data` bleibt kompatibel

          ### Weitere Assets
          - `medialab-portainer-0.4.0.zip` – vollständiges Portainer-Paket
          - `medialab-0.4.0-build.tar.gz` – für Web-Editor/manuelle Builds
          - `medialab-0.4.0-SHA256SUMS.txt` – SHA-256-Prüfsummen

          Footer: **by Lrd.Tiberius**  
          Support: https://www.paypal.com/paypalme/SebastianM207
          EOF

          gh release create v0.4.0 \
            medialab-portainer-upload-0.4.0.tar.gz \
            medialab-portainer-0.4.0.zip \
            medialab-0.4.0-build.tar.gz \
            medialab-0.4.0-SHA256SUMS.txt \
            --title 'MediaLab 0.4.0' \
            --notes-file /tmp/release-notes.md
